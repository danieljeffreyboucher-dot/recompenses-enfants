<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missions Familiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#06070E;--surf:#0A0C18;--card:#0F1228;--card2:#151932;
  --border:rgba(90,110,240,0.13);--text:#DCE2FF;--sub:#6875AA;--muted:#323B62;
  --p1:#FF3D72;--p1-bg:rgba(255,61,114,.1);--p1-brd:rgba(255,61,114,.3);--p1-glow:rgba(255,61,114,.22);
  --p2:#00D4FF;--p2-bg:rgba(0,212,255,.1);--p2-brd:rgba(0,212,255,.3);--p2-glow:rgba(0,212,255,.22);
  --gold:#FFB800;--gold-bg:rgba(255,184,0,.1);--gold-brd:rgba(255,184,0,.3);
  --green:#00DF7A;--green-bg:rgba(0,223,122,.1);--green-brd:rgba(0,223,122,.3);
  --orange:#FF8C00;--orange-bg:rgba(255,140,0,.11);--orange-brd:rgba(255,140,0,.32);
  --red:#FF4444;--red-bg:rgba(255,68,68,.1);
  --r:10px;--r-sm:7px
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#E5E8F5;--surf:#F0F2FF;--card:#FFF;--card2:#EAEDFF;
    --border:rgba(50,60,180,.1);--text:#080A20;--sub:#4A5280;--muted:#9CA5CC
  }
}
:root[data-theme="light"]{
  --bg:#E5E8F5;--surf:#F0F2FF;--card:#FFF;--card2:#EAEDFF;
  --border:rgba(50,60,180,.1);--text:#080A20;--sub:#4A5280;--muted:#9CA5CC
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(100,120,255,.04) 1px,transparent 1px);
  background-size:22px 22px
}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;position:sticky;top:0;z-index:50;background:var(--bg)}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-icon{width:32px;height:32px;background:var(--gold-bg);border:1.5px solid var(--gold-brd);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px}
.hdr-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.hdr-title span{color:var(--gold)}
.btn-lock{width:36px;height:36px;border:1.5px solid var(--border);background:var(--card);border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.btn-lock:hover{background:var(--card2)}
.btn-lock.on{background:var(--gold-bg);border-color:var(--gold-brd)}

/* ── Scoreboard ── */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:0 16px 14px}

.player-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.player-card[data-pid="kaylie"]{--pc:var(--p1);--pg:var(--p1-glow);--pb:var(--p1-brd)}
.player-card[data-pid="leo"]   {--pc:var(--p2);--pg:var(--p2-glow);--pb:var(--p2-brd)}
.player-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--pc)}
.player-card.active{border-color:var(--pb);box-shadow:0 0 0 1px var(--pc),0 0 22px var(--pg)}
.player-card:not(.active):hover{background:var(--card2)}

.pc-leader{position:absolute;top:7px;right:8px;font-size:13px}
.pc-emoji{font-size:26px;display:block;margin-bottom:5px}
.pc-name{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-bottom:3px}
.pc-balance{font-family:'Orbitron',monospace;font-size:19px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-1px;white-space:nowrap}
.pc-balance .u{font-size:10px;font-weight:700;color:var(--sub);margin-left:2px;letter-spacing:0}
.pc-level{display:flex;align-items:center;gap:5px;margin-top:8px}
.pc-lvl{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--pc);white-space:nowrap}
.pc-bar{flex:1;height:4px;background:var(--card2);border-radius:2px;overflow:hidden}
.pc-bar-fill{height:100%;background:var(--pc);border-radius:2px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.pc-pending{margin-top:5px;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;background:var(--orange);border-radius:50%;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.vs{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:var(--muted);text-align:center;letter-spacing:.1em}

/* ── Admin banner ── */
.admin-banner{margin:0 16px 10px;padding:8px 14px;background:var(--gold-bg);border:1px solid var(--gold-brd);border-radius:var(--r-sm);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}

/* ── Content ── */
.content{flex:1;padding:0 16px 110px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sub)}
.btn-add{display:flex;align-items:center;gap:4px;padding:5px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);cursor:pointer;transition:all .15s}
.btn-add:hover{background:var(--card2);color:var(--text)}

.chips{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-brd)}

.slbl{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 10px}
.slbl.orange{color:var(--orange)}

/* ── Mission card (DUO) ── */
.mission-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;position:relative;transition:background .15s}
.mission-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:var(--border)}
.mission-card.has-pending::before{background:var(--orange)}

.mc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mc-icon{font-size:24px;width:42px;height:42px;background:var(--card2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mc-info{flex:1;min-width:0}
.mc-name{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-meta{font-size:11px;color:var(--sub)}
.mc-value{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}

.duo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pa{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:5px;background:var(--card2);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);cursor:pointer;transition:all .15s}
.pa:hover:not(.st-pending):not(.st-disabled){border-color:var(--sub);color:var(--text)}
.pa.st-pending{background:var(--orange-bg);border-color:var(--orange-brd);color:var(--orange);cursor:default}
.pa.st-disabled{opacity:.22;cursor:not-allowed}
.pa.st-approve{background:var(--green-bg);border-color:var(--green-brd);color:var(--green);cursor:pointer}
.pa.st-approve:hover{background:rgba(0,223,122,.2)}
.pa.st-reject{cursor:pointer}
.pa.st-reject:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.pa-l{display:flex;align-items:center;gap:5px}

/* manage */
.manage-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.mgico{font-size:22px;flex-shrink:0}
.mginfo{flex:1;min-width:0}
.mgname{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgmeta{font-size:11px;color:var(--sub)}
.mgval{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.btn-del{width:27px;height:27px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);border-radius:var(--r-sm);font-size:13px;cursor:pointer;transition:all .15s}
.btn-del:hover{color:var(--red);background:var(--red-bg)}

/* badge */
.badge{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:3px}
.badge-k{background:var(--p1-bg);color:var(--p1);border:1px solid var(--p1-brd)}
.badge-l{background:var(--p2-bg);color:var(--p2);border:1px solid var(--p2-brd)}
.badge-b{background:var(--card2);color:var(--sub);border:1px solid var(--border)}

/* ── Shop ── */
.shop-who{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 13px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
.shop-who .amt{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--gold);margin-left:auto;font-variant-numeric:tabular-nums}

.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reward-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.reward-card:hover:not(.locked){background:var(--card2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.reward-card.locked{opacity:.4;cursor:not-allowed}
.rc-ico{font-size:32px;margin-bottom:8px;display:block}
.rc-name{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;line-height:1.3}
.rc-cost{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-brd);border-radius:4px;padding:2px 10px;display:inline-block;font-variant-numeric:tabular-nums}
.rc-miss{font-size:10px;color:var(--muted);font-weight:700;margin-top:5px;font-family:'Rajdhani',sans-serif;text-transform:uppercase}

/* ── Stats ── */
.stat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.stat-lbl{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);width:90px;flex-shrink:0}
.cmp-bar{flex:1;height:8px;border-radius:4px;overflow:hidden;display:flex}
.cmp-k{background:var(--p1);transition:flex .4s}
.cmp-l{background:var(--p2);transition:flex .4s}
.stat-vals{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px;text-align:right}

/* ── History ── */
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.hi-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.hi-ico.earn{background:var(--green-bg)}.hi-ico.spend{background:var(--orange-bg)}
.hi-info{flex:1;min-width:0}
.hi-desc{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-meta{font-size:11px;color:var(--sub);font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.hi-amt{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.hi-amt.earn{color:var(--green)}.hi-amt.spend{color:var(--red)}

/* ── Nav ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--border);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);cursor:pointer;border-radius:var(--r-sm);transition:all .15s}
.nav-btn .ni{font-size:20px;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.nav-btn.on{color:var(--gold)}.nav-btn.on .ni{transform:scale(1.18)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(4,5,12,.82);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surf);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:18px 20px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.m-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.m-title{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}

.fg{margin-bottom:13px}
.fl{display:block;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sub);margin-bottom:6px}
.fi{width:100%;padding:10px 13px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus{border-color:var(--gold)}select.fi{cursor:pointer}

.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:4px}
.eb{aspect-ratio:1;font-size:18px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.eb:hover,.eb.sel{border-color:var(--gold);background:var(--gold-bg)}

.pin-row{display:flex;gap:10px;justify-content:center;margin:16px 0 6px}
.pin-d{width:52px;height:60px;background:var(--card);border:2px solid var(--border);border-radius:var(--r-sm);text-align:center;font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:var(--text);outline:none;transition:border-color .15s;-webkit-text-security:disc}
.pin-d:focus{border-color:var(--gold)}
.pin-hint{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;color:var(--sub);text-align:center;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pin-hint strong{color:var(--gold)}
.pin-err{color:var(--red);font-size:13px;font-weight:700;text-align:center;min-height:20px;font-family:'Rajdhani',sans-serif;text-transform:uppercase}

.btn-p{width:100%;padding:13px;background:var(--gold);color:#06070E;border:none;border-radius:var(--r-sm);font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;transition:all .15s}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{width:100%;padding:11px;background:transparent;color:var(--sub);border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;margin-top:8px;transition:all .15s}
.btn-s:hover{background:var(--card);color:var(--text)}

/* ── Toast ── */
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;z-index:400;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:tIn .25s cubic-bezier(.22,1,.36,1),tOut .25s 2.6s forwards;pointer-events:none}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tOut{to{opacity:0;transform:translateX(-50%) translateY(12px)}}

.coin{position:fixed;pointer-events:none;z-index:500;font-size:20px;animation:cu .9s forwards}
@keyframes cu{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-80px) rotate(40deg) scale(.4)}}

.empty{text-align:center;padding:40px 20px}
.empty-ico{font-size:40px;margin-bottom:10px}
.empty-txt{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.empty-sub{font-size:13px;color:var(--sub);margin-top:5px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Defaults ─────────────────────────────────────────────────
const DEFAULTS={
  children:{
    kaylie:{name:'Kaylie',emoji:'🦋',balance:0},
    leo:   {name:'Léo',  emoji:'🦁',balance:0}
  },
  tasks:[
    {id:'t1',title:'Ranger sa chambre',   value:2,assign:'both',icon:'🛏️',done:{}},
    {id:'t2',title:'Faire la vaisselle',  value:3,assign:'both',icon:'🍽️',done:{}},
    {id:'t3',title:'Faire ses devoirs',   value:5,assign:'both',icon:'📚',done:{}},
    {id:'t4',title:'Sortir les poubelles',value:2,assign:'both',icon:'🗑️',done:{}},
    {id:'t5',title:'Préparer le repas',   value:4,assign:'both',icon:'🥗',done:{}},
    {id:'t6',title:'Nourrir les animaux', value:2,assign:'both',icon:'🐾',done:{}},
  ],
  rewards:[
    {id:'r1',title:"30 min d'écran",      cost:10,icon:'📱'},
    {id:'r2',title:'Choisir le souper',   cost:8, icon:'🍕'},
    {id:'r3',title:'Soirée film',         cost:15,icon:'🎬'},
    {id:'r4',title:'Coucher plus tard',   cost:12,icon:'🌙'},
    {id:'r5',title:'Activité spéciale',   cost:25,icon:'🎡'},
    {id:'r6',title:'Collation au choix',  cost:5, icon:'🍦'},
  ],
  history:[],pin:'1234'
};

// ── State ────────────────────────────────────────────────────
let S,pm=false,shopFor='kaylie',tab='missions',filter='all',modal=null;

function load(){
  try{
    const r=localStorage.getItem('fm_v2');
    if(r){
      const p=JSON.parse(r);
      S={...DEFAULTS,...p,
        children:{
          kaylie:{...DEFAULTS.children.kaylie,...(p.children?.kaylie||{})},
          leo:   {...DEFAULTS.children.leo,   ...(p.children?.leo||{})}
        }
      };return;
    }
  }catch(e){}
  S=JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){try{localStorage.setItem('fm_v2',JSON.stringify(S))}catch(e){}}
load();

// ── Helpers ──────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const uid=()=>'_'+Math.random().toString(36).slice(2,9);
const fmt=n=>Number(n).toFixed(2).replace('.',',');

function totalEarned(cid){return S.history.filter(h=>h.cid===cid&&h.type==='earn').reduce((s,h)=>s+h.amount,0)}
function lvlOf(cid){const te=totalEarned(cid);return{lvl:Math.floor(te/15)+1,pct:(te%15)/15}}
function pendingFor(cid){return S.tasks.filter(t=>(t.assign==='both'||t.assign===cid)&&t.done?.[cid]==='pending').length}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3100);
}
function coins(x,y,n=6){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='coin';el.textContent='💰';
    el.style.cssText=`left:${x+(Math.random()-.5)*60}px;top:${y}px;animation-delay:${i*.06}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }
}

// ── Render ───────────────────────────────────────────────────
function render(){
  $('app').innerHTML=
    hdr()+(pm?`<div class="admin-banner">🔓 ADMIN — Seul toi peut voir ceci</div>`:'')+
    scoreboard()+`<div class="content">${content()}</div>`+
    nav()+(modal?overlay():'');
  bind();
}

function hdr(){
  return`<div class="hdr">
    <div class="hdr-logo">
      <div class="hdr-icon">⚡</div>
      <div class="hdr-title"><span>Missions</span> Familiales</div>
    </div>
    <button class="btn-lock${pm?' on':''}" onclick="clickLock()">${pm?'🔓':'🔑'}</button>
  </div>`;
}

function scoreboard(){
  const kb=S.children.kaylie.balance,lb=S.children.leo.balance;
  return`<div class="scoreboard">
    ${playerCard('kaylie',kb>lb&&kb!==lb)}
    <div class="vs">VS</div>
    ${playerCard('leo',lb>kb&&kb!==lb)}

}

function playerCard(pid,lead){
  const c=S.children[pid],{lvl,pct}=lvlOf(pid),pend=pendingFor(pid);
  return`<div class="player-card${shopFor===pid?' active':''}" data-pid="${pid}" onclick="setShopFor('${pid}')">
    ${lead?`<div class="pc-leader">👑</div>`:''}
    <span class="pc-emoji">${c.emoji}</span>
    <div class="pc-name">${c.name}</div>
    <div class="pc-balance">${fmt(c.balance)}<span class="u">$</span></div>
    <div class="pc-level">
      <span class="pc-lvl">Niv.${lvl}</span>
      <div class="pc-bar"><div class="pc-bar-fill" style="width:${Math.round(pct*100)}%"></div></div>
    </div>
    ${pend>0?`<div class="pc-pending"><span class="dot"></span>${pend} en attente</div>`:''}
  </div>`;
}

function nav(){
  return`<nav class="nav">
    ${[['missions','🎯','Missions'],['shop','🛍️','Boutique'],['stats','📊','Stats'],['history','📋','Journal']].map(([id,ic,lb])=>
      `<button class="nav-btn${tab===id?' on':''}" onclick="setTab('${id}')">
        <span class="ni">${ic}</span>${lb}
      </button>`
    ).join('')}
  </nav>`;
}

function content(){
  switch(tab){
    case'missions':return missions();
    case'shop':    return shop();
    case'stats':   return stats();
    case'history': return history();
    default:return'';
  }
}

// ── Missions (DUO) ───────────────────────────────────────────
function missions(){
  if(pm)return missionsAdmin();
  let tasks=[...S.tasks];
  if(filter==='pending')  tasks=tasks.filter(t=>Object.values(t.done||{}).includes('pending'));
  if(filter==='available')tasks=tasks.filter(t=>!t.done?.kaylie&&!t.done?.leo);
  return`<div class="sec-hd"><div class="sec-title">Missions</div></div>
    <div class="chips">
      ${[['all','Toutes'],['available','Disponibles'],['pending','En attente']].map(([v,l])=>
        `<div class="chip${filter===v?' on':''}" onclick="setFilter('${v}')">${l}</div>`
      ).join('')}
    </div>
    ${tasks.length===0?empty('🎯','Aucune mission','Toutes les missions correspondent à ce filtre.'):''}
    ${tasks.map(t=>missionCard(t)).join('')}`;
}

function missionCard(t){
  const hp=Object.values(t.done||{}).includes('pending');
  return`<div class="mission-card${hp?' has-pending':''}">
    <div class="mc-top">
      <div class="mc-icon">${t.icon||'📌'}</div>
      <div class="mc-info">
        <div class="mc-name">${t.title}</div>
        <div class="mc-meta">${t.assign==='both'?'Tous les deux':S.children[t.assign]?.name||t.assign}</div>
      </div>
      <div class="mc-value">+${fmt(t.value)}$</div>
    </div>
    <div class="duo-row">
      ${playerAction(t,'kaylie')}
      ${playerAction(t,'leo')}
    </div>
  </div>`;
}

function playerAction(t,pid){
  const c=S.children[pid],vis=t.assign==='both'||t.assign===pid,st=t.done?.[pid];
  if(!vis) return`<div class="pa st-disabled"><div class="pa-l"><span>${c.emoji}</span><span>${c.name}</span></div><span>—</span></div>`;
  if(st==='pending') return`<div class="pa st-pending"><div class="pa-l"><span>${c.emoji}</span><span>${c.name}</span></div><span>⏳</span></div>`;
  return`<div class="pa" onclick="markDone('${t.id}','${pid}')"><div class="pa-l"><span>${c.emoji}</span><span>${c.name}</span></div><span>▶</span></div>`;
}

function missionsAdmin(){
  const pend=S.tasks.filter(t=>Object.values(t.done||{}).includes('pending'));
  return`<div class="sec-hd"><div class="sec-title">Missions</div>
      <button class="btn-add" onclick="openModal('addTask')">＋ Ajouter</button></div>
    ${pend.length>0?`<div class="slbl orange">⚡ En attente d'approbation</div>${pend.map(t=>approveCard(t)).join('')}`:''}
    <div class="slbl">Toutes les missions</div>
    ${S.tasks.length===0?empty('🎯','Aucune mission',''):''}
    ${S.tasks.map(t=>manageCard(t)).join('')}`;
}

function approveCard(t){
  return Object.entries(t.done||{}).filter(([,v])=>v==='pending').map(([pid])=>{
    const c=S.children[pid];
    return`<div class="mission-card has-pending">
      <div class="mc-top">
        <div class="mc-icon">${t.icon||'📌'}</div>
        <div class="mc-info"><div class="mc-name">${t.title}</div>
          <div class="mc-meta">${c.emoji} ${c.name}</div></div>
        <div class="mc-value">+${fmt(t.value)}$</div>
      </div>
      <div class="duo-row">
        <div class="pa st-reject" onclick="rejectTask('${t.id}','${pid}')">
          <div class="pa-l"><span>✕</span><span>Refuser</span></div></div>
        <div class="pa st-approve" onclick="approveTask('${t.id}','${pid}',event)">
          <div class="pa-l"><span>✓</span><span>Approuver</span></div>
          <span style="font-family:'Orbitron',monospace;font-size:10px">+${fmt(t.value)}$</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function manageCard(t){
  const a=t.assign==='both'?'Tous les deux':S.children[t.assign]?.name||t.assign;
  return`<div class="manage-card">
    <span class="mgico">${t.icon||'📌'}</span>
    <div class="mginfo"><div class="mgname">${t.title}</div><div class="mgmeta">${a}</div></div>
    <div class="mgval">${fmt(t.value)}$</div>
    <button class="btn-del" onclick="delTask('${t.id}')">🗑</button>
  </div>`;
}

// ── Shop ─────────────────────────────────────────────────────

// ── Stats ────────────────────────────────────────────────────
function stats(){
  const k=S.children.kaylie,l=S.children.leo;
  const ke=totalEarned('kaylie'),le=totalEarned('leo');
  const kt=S.history.filter(h=>h.cid==='kaylie'&&h.type==='earn').length;
  const lt=S.history.filter(h=>h.cid==='leo'   &&h.type==='earn').length;
  const ksp=S.history.filter(h=>h.cid==='kaylie'&&h.type==='spend').reduce((s,h)=>s+h.amount,0);
  const lsp=S.history.filter(h=>h.cid==='leo'   &&h.type==='spend').reduce((s,h)=>s+h.amount,0);

  const row=(lbl,kv,lv,sfx='$')=>{
    const tot=Math.max(kv+lv,.01);
    return`<div class="stat-row">
      <div class="stat-lbl">${lbl}</div>
      <div class="cmp-bar">
        <div class="cmp-k" style="flex:${kv}"></div>
        <div class="cmp-l" style="flex:${lv}"></div>
      </div>
      <div class="stat-vals">
        <span style="color:var(--p1)">${sfx==='$'?fmt(kv):kv}</span>
        <span style="color:var(--muted)"> · </span>
        <span style="color:var(--p2)">${sfx==='$'?fmt(lv):lv}</span>
      </div>
    </div>`;
  };

  const lvCard=pid=>{
    const c=S.children[pid],{lvl,pct}=lvlOf(pid),te=totalEarned(pid);
    const col=pid==='kaylie'?'var(--p1)':'var(--p2)';
    return`<div class="mission-card" style="margin-bottom:10px">
      <div class="mc-top">
        <div class="mc-icon" style="font-size:28px">${c.emoji}</div>
        <div class="mc-info">
          <div class="mc-name">${c.name}</div>
          <div class="mc-meta">${fmt(te)}$ gagnés au total</div>
        </div>
        <div class="mc-value" style="color:${col}">NIV.${lvl}</div>
      </div>
      <div style="background:var(--card2);border-radius:4px;height:8px;overflow:hidden">
        <div style="height:100%;width:${Math.round(pct*100)}%;background:${col};border-radius:4px;transition:width .4s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">
        <span>${fmt(te%15)}$ / 15$ → niv.${lvl+1}</span><span>${Math.round(pct*100)}%</span>
      </div>
    </div>`;
  };

  return`<div class="sec-hd"><div class="sec-title">Statistiques</div></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span style="font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--p1)">🦋 ${k.name}</span>
      <span style="font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--p2)">${l.name} 🦁</span>
    </div>
    ${row('Solde',k.balance,l.balance)}
    ${row('Gagné',ke,le)}
    ${row('Missions',kt,lt,'')}
    ${row('Dépensé',ksp,lsp)}
    <div class="slbl" style="margin-top:20px">Progression</div>
    ${lvCard('kaylie')}${lvCard('leo')}`;
}

        <div class="hi-info">
          <div class="hi-desc">${h.desc}</div>
          <div class="hi-meta">${c.emoji} ${c.name} · ${ds}</div>
        </div>
        <div class="hi-amt ${h.type}">${earn?'+':'-'}${fmt(h.amount)}$</div>

function empty(ico,t,s){
  return`<div class="empty"><div class="empty-ico">${ico}</div><div class="empty-txt">${t}</div><div class="empty-sub">${s}</div></div>`;
}

// ── Actions ──────────────────────────────────────────────────
function setShopFor(p){shopFor=p;render()}
function setTab(t){tab=t;filter='all';render()}
function setFilter(f){filter=f;render()}
function openModal(t){modal={type:t};render()}
function closeModal(){modal=null;render()}
function overlayClick(e){if(e.target.classList.contains('overlay'))closeModal()}
function pickEmoji(e){modal.emoji=e;render()}

function clickLock(){
  if(pm){pm=false;render();toast('MODE ADMIN DÉSACTIVÉ')}
  else{modal={type:'pin'};render();setTimeout(()=>$('pd0')?.focus(),80)}
}

function markDone(tid,pid){
  const t=S.tasks.find(x=>x.id===tid);if(!t)return;
  if(!t.done)t.done={};
  if(t.done[pid]==='pending')return;
  t.done[pid]='pending';
  save();toast("⏳ EN ATTENTE D'APPROBATION");render();
}

function approveTask(tid,pid,ev){
  const t=S.tasks.find(x=>x.id===tid);if(!t)return;
  const c=S.children[pid];
  c.balance=Math.round((c.balance+t.value)*100)/100;
  t.done[pid]=null;
  S.history.push({id:uid(),cid:pid,type:'earn',amount:t.value,desc:`Mission : ${t.title}`,date:new Date().toISOString()});
  save();
  const r=ev.target.getBoundingClientRect();
  coins(r.left+r.width/2,r.top,7);
  toast(`💰 +${fmt(t.value)}$ POUR ${c.name.toUpperCase()} !`);render();
}

function rejectTask(tid,pid){
  const t=S.tasks.find(x=>x.id===tid);if(!t||!t.done)return;
  t.done[pid]=null;save();toast('MISSION REFUSÉE');render();
}

function buyReward(rid){
  if(pm)return;
  const r=S.rewards.find(x=>x.id===rid);if(!r)return;
  const c=S.children[shopFor];
  if(c.balance<r.cost)return;
  c.balance=Math.round((c.balance-r.cost)*100)/100;
  S.history.push({id:uid(),cid:shopFor,type:'spend',amount:r.cost,desc:`Récompense : ${r.title}`,date:new Date().toISOString()});
  save();toast(`🎉 ${r.title.toUpperCase()} DÉBLOQUÉ !`);render();
}

function delTask(tid){S.tasks=S.tasks.filter(t=>t.id!==tid);save();render()}
function delReward(rid){S.rewards=S.rewards.filter(r=>r.id!==rid);save();render()}

function saveTask(){
  const title=($('tt')?.value||'').trim(),val=parseFloat($('tv')?.value),assign=$('ta')?.value||'both';
  if(!title){toast('⚠ ENTREZ UN NOM');return}
  if(!val||val<=0){toast('⚠ MONTANT INVALIDE');return}
  S.tasks.push({id:uid(),title,value:val,assign,icon:modal.emoji||'📌',done:{}});
  save();closeModal();toast('✅ MISSION AJOUTÉE');
}

function saveReward(){
  const title=($('rt')?.value||'').trim(),cost=parseFloat($('rc')?.value);
  if(!title){toast('⚠ ENTREZ UN NOM');return}
  if(!cost||cost<=0){toast('⚠ MONTANT INVALIDE');return}
  S.rewards.push({id:uid(),title,cost,icon:modal.emoji||'🎁'});
  save();closeModal();toast('🛍️ RÉCOMPENSE AJOUTÉE');
}

function saveAdjust(){
  const cid=$('ac')?.value,amount=parseFloat($('am')?.value),type=$('at')?.value;
  const desc=($('ar')?.value||'').trim()||'Ajustement';
  if(!amount||amount<=0){toast('⚠ MONTANT INVALIDE');return}
  const c=S.children[cid];
  if(type==='earn')c.balance=Math.round((c.balance+amount)*100)/100;
  else c.balance=Math.max(0,Math.round((c.balance-amount)*100)/100);
  S.history.push({id:uid(),cid,type,amount,desc,date:new Date().toISOString()});
  save();closeModal();toast('✅ SOLDE AJUSTÉ');
}

// ── PIN ──────────────────────────────────────────────────────
function bind(){
  [0,1,2,3].forEach(i=>{
    const el=$(`pd${i}`);if(!el)return;
    el.addEventListener('input',()=>{
      const v=el.value.replace(/\D/g,'');el.value=v.slice(-1);
      if(el.value&&i<3)$(`pd${i+1}`)?.focus();
      if([0,1,2,3].every(j=>$(`pd${j}`)?.value.length===1))checkPin();
    });
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)$(`pd${i-1}`)?.focus()});
  });
}

function checkPin(){
  const pin=[0,1,2,3].map(i=>$(`pd${i}`)?.value||'').join('');
  if(pin===(S.pin||'1234')){pm=true;closeModal();toast('🔓 ACCÈS ADMIN ACTIVÉ')}
  else{
    const e=$('pin-err');if(e)e.textContent='NIP INCORRECT';
    [0,1,2,3].forEach(i=>{const el=$(`pd${i}`);if(el)el.value=''});
    $('pd0')?.focus();
  }
}

render();
</script>
